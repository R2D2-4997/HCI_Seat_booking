<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TactileSeat — Dot Pad</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #1a365d;
    }
    h4 {
      margin: 16px 0 6px;
      color: #4a5568;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background-color: #0052a3;
    }
    button.secondary {
      background-color: #e2e8f0;
      color: #1a202c;
    }
    #status, #section {
      font-size: 13px;
      color: #333;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>TactileSeat — Dot Pad</h3>
  <p style="font-size:12px;color:#555">Gardez cet onglet ouvert (vous pouvez l'épingler) : il maintient la connexion au Dot Pad. Revenez ensuite sur l'onglet du site de réservation.</p>

  <button id="btn-usb">Connecter (USB)</button>
  <button id="btn-bluetooth">Connecter (Bluetooth)</button>
  <button id="btn-bluetooth-all" class="secondary">Bluetooth : afficher tous les appareils</button>
  <button id="btn-disconnect" class="secondary">Déconnecter</button>

  <h4>Tests du matériel</h4>
  <button id="btn-test" class="secondary">Image de test (cadre + diagonale)</button>
  <button id="btn-sample" class="secondary">Échantillon des motifs de sièges</button>
  <button id="btn-up" class="secondary">Lever tous les picots</button>
  <button id="btn-down" class="secondary">Baisser tous les picots</button>

  <div id="status" role="status" aria-live="polite">Non connecté.</div>
  <div id="section" aria-live="polite"></div>

  <h4>Journal Bluetooth (débogage)</h4>
  <pre id="log" style="font-size:11px;background:#f7fafc;border:1px solid #e2e8f0;padding:8px;max-height:300px;overflow:auto;white-space:pre-wrap;"></pre>

  <script type="module" src="dotpad-page.js"></script>
</body>
</html>
